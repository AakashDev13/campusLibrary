<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campus Library</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Campus Library</h1>
    <p class="sub">Authors and their books — data served by GraphQL</p>

    <div id="list">Loading books...</div>

    <form id="addForm">
      <h3>Add a book</h3>
      <input id="title" placeholder="Book title" required maxlength="200">
      <input id="year" type="number" placeholder="Year" min="0" max="9999">
      <select id="authorId" required>
        <option value="">Loading authors...</option>
      </select>
      <button id="addButton" type="submit">Add book</button>
      <div id="message" role="status"></div>
    </form>
  </main>

  <script>
    const API = 'http://localhost:4000/';

    async function gql(query, variables = {}) {
      const response = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query, variables })
      });

      const result = await response.json();
      if (!response.ok || result.errors) {
        throw new Error(result.errors?.[0]?.message || 'Request failed');
      }
      return result.data;
    }

    function showMessage(text, type = '') {
      const message = document.getElementById('message');
      message.textContent = text;
      message.className = type;
    }

    async function loadAuthors() {
      const data = await gql(`query { authors { id name } }`);
      const select = document.getElementById('authorId');
      select.innerHTML = '';

      data.authors.forEach(author => {
        const option = document.createElement('option');
        option.value = author.id;
        option.textContent = author.name;
        select.appendChild(option);
      });
    }

    async function loadBooks() {
      const list = document.getElementById('list');
      list.textContent = 'Loading books...';

      try {
        const data = await gql(`
          query {
            authors {
              id
              name
              country
              books { title year }
            }
          }
        `);

        if (data.authors.length === 0) {
          list.textContent = 'No authors found. Add authors to the database first.';
          return;
        }

        list.innerHTML = data.authors.map(author => `
          <section class="author-card">
            <h2>${escapeHtml(author.name)}</h2>
            <div class="country">${escapeHtml(author.country || '')}</div>
            ${author.books.length
              ? author.books.map(book => `
                <div class="book">
                  ${escapeHtml(book.title)}
                  <span class="yr">(${book.year ?? 'Year unknown'})</span>
                </div>
              `).join('')
              : '<div class="book">No books yet.</div>'}
          </section>
        `).join('');
      } catch (error) {
        list.textContent = 'Could not load books. Check that the API and MySQL are running.';
        showMessage(error.message, 'error');
      }
    }

    // Escape database text before inserting it into HTML.
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[character]);
    }

    document.getElementById('addForm').addEventListener('submit', async event => {
      event.preventDefault();
      const title = document.getElementById('title').value.trim();
      const yearInput = document.getElementById('year').value;
      const year = yearInput === '' ? null : Number(yearInput);
      const authorId = document.getElementById('authorId').value;
      const button = document.getElementById('addButton');

      if (!title || !authorId) {
        showMessage('Please enter a title and select an author.', 'error');
        return;
      }

      button.disabled = true;
      showMessage('Adding book...');

      try {
        await gql(`
          mutation AddBook($title: String!, $year: Int, $authorId: ID!) {
            addBook(title: $title, year: $year, authorId: $authorId) {
              id
              title
            }
          }
        `, { title, year, authorId });

        event.target.reset();
        await loadAuthors();
        await loadBooks();
        showMessage('Book added successfully!', 'success');
      } catch (error) {
        showMessage(error.message, 'error');
      } finally {
        button.disabled = false;
      }
    });

    async function init() {
      try {
        await loadAuthors();
        await loadBooks();
      } catch (error) {
        document.getElementById('list').textContent =
          'Could not connect. Start the GraphQL server and check the MySQL settings.';
        showMessage(error.message, 'error');
      }
    }

    init();
  </script>
</body>
</html>
